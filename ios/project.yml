name: Newsticker
options:
  bundleIdPrefix: com.mkdebie
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Newsticker:
    type: application
    platform: iOS
    sources: [Newsticker, Shared]
    dependencies:
      - target: NewstickerWidget
    entitlements:
      path: Newsticker/Newsticker.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mkdebie.newsticker]
    info:
      path: Newsticker/Info.plist
      properties:
        CFBundleDisplayName: Newsticker
        CFBundleURLTypes:
          - CFBundleURLName: com.mkdebie.newsticker
            CFBundleURLSchemes: [newsticker]
        LSApplicationCategoryType: public.app-category.news
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations: [nl]
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.mkdebie.newsticker.refresh, com.mkdebie.newsticker.scoring]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mkdebie.newsticker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: SBB8YRNS5R
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"

  NewstickerWidget:
    type: app-extension
    platform: iOS
    sources: [NewstickerWidget, Shared]
    entitlements:
      path: NewstickerWidget/NewstickerWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mkdebie.newsticker]
    info:
      path: NewstickerWidget/Info.plist
      properties:
        CFBundleDisplayName: Newsticker
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mkdebie.newsticker.widget
        DEVELOPMENT_TEAM: SBB8YRNS5R
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
